</style></head><body>
<header><h1><span>ER Triage</span> Helper <span style="display:none">🌼</h1>
<p class="tag">A pretend hospital shift. Sick patients get a risk score, the minor cases go to a fast-track corner, and you can watch it all happen.</p>
<nav id="nav"></nav></header>
<main id="app"></main>
<div id="modal"><div id="mc"></div></div>
<script>
(()=>{
const $=i=>document.getElementById(i);
let S={docs:2,nurses:2,treat:10,fast:5,hours:7.5,alert:9,rate:15,sickPct:20,minorPct:30,det:100,seed:7,shift:0,ev:2,wv:100,wt:4,wc:2};
const K=Object.keys(S),SH=['Morning 6am–2pm','Afternoon 2pm–10pm','Night 10pm–6am'],SHS=[6,14,22];
const SL=[['docs','ER doctors',1,6,1],['nurses','Fast-track nurses',1,6,1],['treat','Minutes per emergency patient',4,25,1],['fast','Minutes per minor patient',2,15,1],['hours','Hours open (7.5 = 450 min)',2,24,.25],['alert','Alert score',5,14,1],['rate','Patients arriving per hour',6,30,1],['sickPct','Seriously sick (%)',5,50,1],['minorPct','Minor cases (%)',0,70,1],['det','How fast sick patients worsen (%)',50,300,10],['ev','Surprise events per shift',0,4,1],['wv','Score: weight of vital signs (%)',0,200,25],['wt','Score: max points for waiting time',0,8,1],['wc','Score: max points for past conditions',0,4,1]];
const mk=a=>()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const ri=(r,a,b)=>a+Math.floor(r()*(b-a+1)),ru=(r,a,b)=>a+r()*(b-a),pk=(r,a)=>a[Math.floor(r()*a.length)];
const FN='Maya Noor Ali Sofia Liam Zara Omar Ivy Hugo Amira Leo Priya Jonah Fatima Theo Mei Sam Nadia Ravi Clara Eli Hana Diego Tara Ben Lina Yusuf Rosa Kai Anya'.split(' '),LN='Khan Rivera Chen Okafor Silva Haddad Nguyen Brooks Patel Novak Ahmed Lopez Tanaka Murphy Rossi Sato Malik Costa Ivanov Reyes'.split(' ');
const COND=['Type 2 diabetes','Hypertension','Asthma','Heart disease','COPD','Kidney disease','Epilepsy','Penicillin allergy'],HR=['Type 2 diabetes','Heart disease','COPD','Kidney disease','Asthma'];
const CCE=['Sprained ankle','Deep cut needing stitches','Migraine','Abdominal pain','Back pain','Fever and cough','Broken finger','Kidney stone pain'],CCS=['Chest tightness','Trouble breathing','Severe infection','Dizziness and fainting','Possible stroke symptoms'],CCM=['Paper cut, needs a bandage','Injection (brought their own)','Small scrape','Dressing change','Vaccine shot (brought their own)','Blood pressure check','Insect bite'];
const PREV=['Chest pain check','Asthma flare-up','Sprained wrist','High fever','Stitches','Allergic reaction'],NOTE=['Sent home the same day','Given antibiotics','Told to follow up with their GP','Watched overnight','Prescribed an inhaler'];
const DS=['Emergency Medicine','Cardiology','Trauma Surgery','Pediatrics','Neurology','Pulmonology','Internal Medicine'],NS=['Triage Nursing','Wound Care','Injections and Vaccines','Pediatric Nursing','Critical Care Nursing','Emergency Nursing'];
const SKIN=['#f6d5b8','#e8b98f','#c68d62','#8d5a3b','#f3c9a6'],HAIR=['#3b2a20','#6b4226','#c9a227','#1e1e24','#b5532f','#9aa0a6'],BG=['#ffc9dd','#c5ecd3','#c6e2ff','#dccfff','#ffd8bd','#ffe98a'];
const av=(n,z,coat)=>{const r=mk(n+11),sk=pk(r,SKIN),h=pk(r,HAIR),b=pk(r,BG),long=r()<.5;return`<svg width="${z}" height="${z}" viewBox="0 0 40 40" aria-hidden="true" style="flex:none"><circle cx="20" cy="20" r="20" fill="${b}"/>${long?`<rect x="8" y="12" width="24" height="22" rx="10" fill="${h}"/>`:''}<path d="M6 40c0-9 6-12 14-12s14 3 14 12z" fill="${coat?'#fff':pk(r,BG)}" stroke="${coat?'#c3b8cf':'none'}"/><circle cx="20" cy="21" r="10" fill="${sk}"/><path d="M10 19c0-9 20-9 20 0c-4-4-14-4-20 0z" fill="${h}"/><circle cx="16.5" cy="22" r="1.3" fill="#3b2a20"/><circle cx="23.5" cy="22" r="1.3" fill="#3b2a20"/><path d="M16.5 26q3.5 3 7 0" fill="none" stroke="#a5524a" stroke-width="1.3" stroke-linecap="round"/>${coat?'<path d="M18 32h4M20 30v4" stroke="#e5547a" stroke-width="1.6"/>':''}</svg>`};
let ST={};
const staff=sh=>{if(ST[sh])return ST[sh];const r=mk(900+sh*77),o={d:[],n:[]};for(let i=0;i<6;i++){let a=ri(r,31,62);o.d.push({name:'Dr. '+pk(r,FN)+' '+pk(r,LN),age:a,spec:pk(r,DS),yrs:a-27-ri(r,0,3),a:ri(r,0,9999)});a=ri(r,24,58);o.n.push({name:'Nurse '+pk(r,FN)+' '+pk(r,LN),age:a,spec:pk(r,NS),yrs:a-22-ri(r,0,3),a:ri(r,0,9999)})}return ST[sh]=o};
let EV=[];
const gen=()=>{const r=mk(S.seed),r2=mk(S.seed*7+3),P=[],H=S.hours*60;let id=0;EV=[];
for(let i=0;i<S.ev;i++)EV.push({k:i%3,t:ri(r2,20,Math.max(21,H-45))});
for(let now=0;now<H;now++){if(r()<S.rate/60){id++;P.push(mkP(r,id,now))}
EV.forEach(e=>{if(e.k==0&&e.t==now)for(let j=0;j<3;j++){id++;P.push(mkP(r2,id,now,1))}})}
EV.forEach(e=>{if(e.k==2){const q=P.find(p=>!p.minor&&p.arrive>=e.t);if(q){q.crash=q.arrive+ri(r2,8,20);e.id=q.id}}});return P};
const mkP=(r,id,now,f)=>{const minor=!f&&r()<S.minorPct/100,sick=f||(!minor&&r()<S.sickPct/100),age=minor?ri(r,4,80):sick?ri(r,45,90):ri(r,3,75);
const p={id,arrive:now,minor,sick,age,sex:r()<.5?'F':'M',name:pk(r,FN)+' '+pk(r,LN),av:ri(r,0,9999)};
if(sick){p.hr=ri(r,100,125);p.ox=ru(r,91,94);p.bp=ri(r,95,115);p.temp=ru(r,37.5,39.5)}else{p.hr=ri(r,60,95);p.ox=ru(r,96,100);p.bp=ri(r,110,135);p.temp=ru(r,36.2,37.6)}
p.sugar=sick?ri(r,110,320):ri(r,72,140);p.cond=COND.filter(()=>r()<age/250+(sick?.15:0));if(p.cond.includes(COND[0]))p.sugar+=60;
p.wt=age<14?ri(r,15,50):ri(r,50,110);p.ht=age<14?ri(r,100,155):ri(r,150,190);
p.cc=pk(r,minor?CCM:sick?CCS:CCE);p.ret=[];if(r()<.3){const n=ri(r,1,2);for(let i=0;i<n;i++)p.ret.push({ago:ri(r,2,400)+' days ago',why:pk(r,PREV),note:pk(r,NOTE)})}return p};
const vit=(p,t,e)=>{const m=Math.min(t,e==null?t:e),n=p.sick?Math.max(0,(m-p.arrive+1))*S.det/100:0,c=p.crash!=null&&m>=p.crash?1:0;return{hr:p.hr+.25*n+15*c,ox:p.ox-.15*n-4*c,bp:p.bp-.2*n-15*c}};
const sc=(p,t,e,L)=>{const v=vit(p,t,e);let s=0;const a=(l,x)=>{if(/^(Heart|Oxygen|Blood pressure|Temp)/.test(l))x=Math.round(x*S.wv/100);s+=x;L&&x&&L.push([l,x])};
a('Heart rate '+Math.round(v.hr),v.hr>130||v.hr<40?3:v.hr>110||v.hr<50?2:v.hr>100?1:0);
a('Oxygen '+v.ox.toFixed(0)+'%',v.ox<90?3:v.ox<93?2:v.ox<95?1:0);
a('Blood pressure '+Math.round(v.bp),v.bp<90?3:v.bp<100?2:v.bp>180?1:0);
a('Temperature '+p.temp.toFixed(1)+' °C',p.temp>39.5||p.temp<35?2:p.temp>38?1:0);
a('Age '+p.age,p.age>=75||p.age<=2?2:p.age>=60?1:0);
a('Blood sugar '+p.sugar,p.sugar<70||p.sugar>250?2:p.sugar>180?1:0);
a('Past conditions',Math.min(S.wc,p.cond.filter(c=>HR.includes(c)).length));
a('Time waiting',Math.min(S.wt,Math.floor(((e==null?t:Math.min(t,e))-p.arrive)/15)));return{t:s,v}};
let P=[],R={};
const run=mode=>{const st={},fin={},who={},al=[],q=[],last={},alr={},wq=[],fq=[],dF=Array(S.docs).fill(-1),nF=Array(S.nurses).fill(-1);let i=0;
for(let now=0;now<S.hours*60;now++){
while(i<P.length&&P[i].arrive===now){(P[i].minor?fq:wq).push(P[i]);i++}
if(mode==='smart')wq.forEach(p=>{const s=sc(p,now).t,j=last[p.id]!==undefined&&s-last[p.id]>=3;if((s>=S.alert&&!alr[p.id])||j){alr[p.id]=1;al.push({t:now,id:p.id,s})}last[p.id]=s});
for(let k=0;k<S.docs&&wq.length;k++)if(dF[k]<=now&&!(k==0&&EV.some(e=>e.k==1&&now>=e.t&&now<e.t+25))){let n=wq[0];if(mode==='smart'){let b=-1;wq.forEach(p=>{const s=sc(p,now).t;if(s>b){b=s;n=p}})}wq.splice(wq.indexOf(n),1);st[n.id]=now;fin[n.id]=now+S.treat;who[n.id]=k;dF[k]=now+S.treat}
for(let k=0;k<S.nurses&&fq.length;k++)if(nF[k]<=now){const n=fq.shift();st[n.id]=now;fin[n.id]=now+S.fast;who[n.id]=k;nF[k]=now+S.fast}
q.push([wq.length,fq.length])}
return{st,fin,who,al,q}};
const FNAME=['Age','Heart rate','Oxygen','Blood pressure','Temperature','Blood sugar','BMI','Serious conditions'];
const feat=p=>[p.age,p.hr,p.ox,p.bp,p.temp,p.sugar,p.wt/Math.pow(p.ht/100,2),p.cond.filter(c=>HR.includes(c)).length];
const lab=p=>{const t=p.arrive+60;return sc(p,t).t>=S.alert+2||vit(p,t).ox<88?1:0};
let MD=null;
const train=()=>{const r=mk(4242),X=[],Y=[];for(let i=0;i<900;i++){const p=mkP(r,i+1,0);if(p.minor)continue;X.push(feat(p));Y.push(lab(p))}
const n=X.length,d=8,mu=Array(d).fill(0),sd=Array(d).fill(0);X.forEach(x=>x.forEach((v,j)=>mu[j]+=v/n));X.forEach(x=>x.forEach((v,j)=>sd[j]+=(v-mu[j])**2/n));for(let j=0;j<d;j++)sd[j]=Math.sqrt(sd[j])||1;
const Z=X.map(x=>x.map((v,j)=>(v-mu[j])/sd[j]));let w=Array(d).fill(0),b=0;
for(let e=0;e<300;e++){const g=Array(d).fill(0);let gb=0;Z.forEach((z,i)=>{const er=1/(1+Math.exp(-(b+z.reduce((s,v,j)=>s+v*w[j],0))))-Y[i];z.forEach((v,j)=>g[j]+=er*v/n);gb+=er/n});w=w.map((v,j)=>v-.5*(g[j]+.001*v));b-=.5*gb}
MD={w,b,mu,sd,n,pos:Y.reduce((a,c)=>a+c,0)}};
const zc=p=>feat(p).map((v,j)=>(v-MD.mu[j])/MD.sd[j]*MD.w[j]);
const prob=p=>1/(1+Math.exp(-(MD.b+zc(p).reduce((a,c)=>a+c,0))));
const band=q=>q>=.6?'High risk':q>=.2?'Medium risk':'Low risk';
const aib=p=>{const q=prob(p);return`<span class="sb ${q>=.6?'x':q>=.2?'h':''}">${Math.round(q*100)}%</span>`};
const aiSec=p=>{const q=prob(p),c=zc(p).map((v,j)=>[FNAME[j],v]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])).slice(0,3);return`<h3 style="margin-top:14px">AI classification</h3>${kv('Chance of turning critical within 1 hour of waiting',Math.round(q*100)+'% ('+band(q)+')')}${c.map(a=>kv('Pushing '+(a[1]>0?'risk up':'risk down')+': '+a[0],(a[1]>0?'+':'')+a[1].toFixed(2))).join('')}`};
const clsTab=()=>{const E=P.filter(p=>!p.minor),T=E.map(p=>[prob(p)>=.5?1:0,lab(p)]),c=(a,b)=>T.filter(x=>x[0]==a&&x[1]==b).length,tp=c(1,1),fp=c(1,0),fn=c(0,1),tn=c(0,0),n=T.length||1,
fw=FNAME.map((nm,j)=>[nm,MD.w[j]]).sort((a,b)=>Math.abs(b[1])-Math.abs(a[1])),mw=Math.max(...fw.map(x=>Math.abs(x[1])))||1,top=E.slice().sort((a,b)=>prob(b)-prob(a)).slice(0,8);
const cell=(v,l,bg)=>`<div class="card" style="margin:0;padding:12px;text-align:center;background:var(--${bg})"><div class="big" style="margin:0">${v}</div><div class="s">${l}</div></div>`;
return`<h2>Classification model</h2><p class="sub">A small logistic regression model learns from simulated patients to predict who will turn critical if they wait an hour. It sorts every emergency patient into low, medium or high risk, using only what is known at arrival.</p>
<div class="g2"><section class="card"><h3>How well it works on this shift</h3>${kv('Trained on',MD.n+' simulated patients ('+MD.pos+' critical)')}${kv('Tested on',E.length+' patients from this shift')}${kv('Accuracy',((tp+tn)/n*100).toFixed(0)+'%')}${kv('Critical patients it caught',(tp+fn?tp/(tp+fn)*100:0).toFixed(0)+'%')}${kv('Its warnings that were right',(tp+fp?tp/(tp+fp)*100:0).toFixed(0)+'%')}</section>

<div class="hint">${df>0?`Lower-risk patients wait about ${df.toFixed(1)} min longer on average. The waiting-time bonus (up to +4) is what stops them waiting forever.`:'In this run lower-risk patients did not wait longer on average.'} Fast-track patients are not affected: they have their own nurses.</div>`};
/* SETTINGS */
const code=()=>K.map(k=>S[k]).join('.');
const sett=()=>`<h2>Build your ER</h2><p class="sub">Change anything and every tab updates.</p><div class="card">${SL.map(s=>`<div class="ctl"><label for="s_${s[0]}" style="width:240px">${s[1]}: <b id="v_${s[0]}">${S[s[0]]}</b></label><input type="range" id="s_${s[0]}" data-k="${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${S[s[0]]}"></div>`).join('')}
<div class="ctl" style="margin-top:8px"><label>Random seed <input type="number" id="sd" min="1" max="99999" value="${S.seed}"></label><label>Shift <select id="shf">${SH.map((x,i)=>`<option value="${i}" ${S.shift==i?'selected':''}>${x}</option>`).join('')}</select></label></div></div>
<div class="card"><h3>Share these settings</h3><div class="s">Copy this code. To reopen the same ER, put # and the code on the end of the page link, or paste it below.</div><div class="ctl"><input type="text" id="cd" value="${code()}" style="flex:1" aria-label="Settings code"><button class="btn" id="ld">Load code</button></div></div><div class="card" id="sr"></div>`;
const sres=()=>{const a=stats(R.fifo),b=stats(R.smart);$('sr').innerHTML=`<h3>Result with these settings</h3>${P.length} patients arrived (${P.filter(p=>p.minor).length} fast-track, ${P.filter(p=>p.sick).length} seriously sick).<br>Sick patients wait ${a.sick.toFixed(1)} min with first come and ${b.sick.toFixed(1)} min with the risk score.`};
const draw=()=>{stop();nav();const f=[board,results,pats,staffTab,many,fair,sett,clsTab][tab];$('app').innerHTML=f();if(tab==0)bb();if(tab==6)sres()};
const open=id=>modal(id);
document.addEventListener('click',e=>{const x=e.target,q=s=>x.closest(s);let c;
if(c=q('[data-t]')){tab=+c.dataset.t;draw()}else if(c=q('[data-p]'))open(+c.dataset.p);else if(q('[data-close]')||x.id=='modal')$('modal').classList.remove('on');
else if(c=q('[data-f]')){pf=c.dataset.f;draw()}else if(c=q('[data-sh]')){S.shift=+c.dataset.sh;go();draw()}
else if(x.id=='rt')runMany();
else if(x.id=='pl'){if(tm){stop();x.textContent='Play'}else{if(t>=S.hours*60-1)t=0;x.textContent='Pause';tm=setInterval(()=>{t=Math.min(t+spd,S.hours*60-1);bb();if(t>=S.hours*60-1){stop();$('pl').textContent='Play'}},350)}}
else if(x.id=='ld'){const v=$('cd').value.trim().split('.').map(Number);if(v.length==K.length&&v.every(n=>!isNaN(n))){K.forEach((k,i)=>S[k]=v[i]);go();draw()}}});
document.addEventListener('keydown',e=>{if(e.key=='Escape')$('modal').classList.remove('on');if((e.key=='Enter')&&e.target.dataset&&e.target.dataset.p)open(+e.target.dataset.p)});
document.addEventListener('input',e=>{const x=e.target;if(x.id=='sc'){t=+x.value;bb()}else if(x.dataset.k){S[x.dataset.k]=+x.value;$('v_'+x.dataset.k).textContent=x.value;t=0;tests=null;go();$('cd').value=code();sres()}});
document.addEventListener('change',e=>{const x=e.target;if(x.id=='md'){mode=x.value;bb()}else if(x.id=='sp')spd=+x.value;else if(x.id=='sd'){S.seed=Math.max(1,+x.value||7);tests=null;go();$('cd').value=code();sres()}else if(x.id=='shf'){S.shift=+x.value;$('cd').value=code();sres()}});
try{const h=location.hash.slice(1).split('.').map(Number);if(h.length==K.length&&h.every(n=>!isNaN(n)))K.forEach((k,i)=>S[k]=h[i])}catch(e){}
go();draw();
})();
</script></body></html>
